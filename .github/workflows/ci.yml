name: ci

# Tests on every pull request and branch push. `publish.yml` gates its image on the pure core only;
# this one also builds the live node and runs the integration tests against real iroh endpoints
# (the two-node stash tests and the repeater tests), which nothing ran in CI before.

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
      - name: cargo fmt
        working-directory: rust
        run: cargo fmt --all --check
      - name: cargo test (pure core)
        working-directory: rust
        run: cargo test --locked --workspace
      - name: cargo test (live node + repeater)
        working-directory: rust
        run: cargo test --locked -p trail-stash --features live -- --test-threads=4
